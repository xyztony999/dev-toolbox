name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli-portable:
    name: CLI 便携包 — ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 交叉编译静态 CLI
        shell: bash
        run: |
          mkdir -p dist
          ext='' ; if [ '${{ matrix.os }}' = windows ]; then ext='.exe'; fi
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -o "dist/dev-toolbox${ext}" ./cmd/dev-toolbox
      - name: 打包（Windows 用 zip，Linux 用 tar.gz）
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="dev-toolbox-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "pack/$stage"
          cp -r dist/. "pack/$stage/"
          cp LICENSE NOTICE README.md "pack/$stage/"
          if [ '${{ matrix.os }}' = windows ]; then
            (cd pack && 7z a "../${stage}.zip" "$stage")
          else
            tar -czf "${stage}.tar.gz" -C pack "$stage"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dev-toolbox-*.tar.gz
            dev-toolbox-*.zip

  linux-packages:
    name: Linux 包（deb / rpm）— ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装打包工具
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: 交叉编译静态 CLI
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -o dist/dev-toolbox ./cmd/dev-toolbox
      - name: 构建 deb 与 rpm
        shell: bash
        run: |
          chmod +x tools/packaging/build-linux-packages.sh
          tools/packaging/build-linux-packages.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} dist/dev-toolbox
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dev-toolbox_*.deb
            dev-toolbox-*.rpm

  gui-windows:
    name: 桌面客户端（安装包 + 便携版）— windows/amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 生成内嵌前端
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build:desktop
      - name: 编译 GUI 与静态 CLI
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;' + $env:Path
          $env:CGO_ENABLED = '1'
          go build -tags gui -ldflags="-H windowsgui" -o dist/dev-toolbox-gui.exe ./cmd/dev-toolbox
          $env:CGO_ENABLED = '0'
          go build -trimpath -o dist/dev-toolbox.exe ./cmd/dev-toolbox
      - name: Inno Setup 安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=$($env:GITHUB_REF_NAME -replace '^v', '') `
            /DBinGui="$PWD\dist\dev-toolbox-gui.exe" `
            /DBinCli="$PWD\dist\dev-toolbox.exe" `
            tools\installer\dev-toolbox.iss
      - name: 便携版 zip 与安装包平铺
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $stage = "dev-toolbox-gui-$version-windows-amd64"
          New-Item -ItemType Directory -Force -Path "pack/$stage" | Out-Null
          Copy-Item dist/dev-toolbox-gui.exe, dist/dev-toolbox.exe, LICENSE, NOTICE, README.md "pack/$stage/"
          Compress-Archive -Path "pack/$stage" -DestinationPath "$stage.zip"
          # 平铺到根，避免 upload-artifact 保留 dist/ 层级导致发布作业 glob 不中
          Copy-Item "dist/dev-toolbox-gui-$version-windows-amd64-setup.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows-amd64
          path: |
            dev-toolbox-gui-*-windows-amd64-setup.exe
            dev-toolbox-gui-*-windows-amd64.zip

  gui-linux:
    name: 桌面客户端 — linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装 GTK/WebKitGTK 依赖
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: 生成内嵌前端
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build:desktop
      - name: 编译 Linux GUI
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -tags gui -trimpath -o dist/dev-toolbox-gui ./cmd/dev-toolbox
      - name: 打包 tar.gz 与 deb
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="dev-toolbox-gui-$version-linux-amd64"
          mkdir -p "pack/$stage"
          cp dist/dev-toolbox-gui "pack/$stage/"
          cp LICENSE NOTICE README.md "pack/$stage/"
          tar -czf "$stage.tar.gz" -C pack "$stage"
          chmod +x tools/packaging/build-linux-packages.sh
          tools/packaging/build-linux-packages.sh "$version" amd64 dist/dev-toolbox-gui gui
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux-amd64
          path: |
            dev-toolbox-gui-*-linux-amd64.tar.gz
            dev-toolbox-gui_*_amd64.deb

  release:
    name: 发布 GitHub Release
    needs: [cli-portable, linux-packages, gui-windows, gui-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          sha256sum *.tar.gz *.zip *.exe *.deb *.rpm > SHA256SUMS.txt
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="## DevToolbox ${GITHUB_REF_NAME}

          以项目为入口，管理\"这套项目用哪套运行时、哪个 Git 身份\"。

          ### 下载说明
          - **Windows 桌面客户端**：\`dev-toolbox-gui-*-windows-amd64-setup.exe\`（用户级安装，无需管理员；不修改 PATH、不自动执行任何配置）。便携版用 \`dev-toolbox-gui-*-windows-amd64.zip\`（内含同名静态 CLI）。
          - **Linux CLI 包**：Debian/Ubuntu 用 \`dev-toolbox_*_<架构>.deb\`，Fedora/RHEL/openSUSE 用 \`dev-toolbox-*-1.<架构>.rpm\`（依赖 git）；\`dev-toolbox-*-linux-*.tar.gz\` 为手动安装的便携包。
          - \`SHA256SUMS.txt\`：全部产物的 SHA-256 校验和。
          - Linux 桌面客户端暂未预构建（依赖 WebKitGTK，需自行构建，见 README）。

          完整变更见下方 commits；设计与验证报告见仓库 profiles/dev-toolbox/workspace/。"
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "DevToolbox ${GITHUB_REF_NAME}" \
            --notes "$notes"
